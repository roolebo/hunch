[package]
name = "hunch-host"
version = "0.1.0"
edition = "2024"
description = "Serves a host's roles to hunch: window managers, seat, compute"
license = "MIT"

[features]
default = ["wm", "compute", "seat", "browser"]
wm = []
browser = []
compute = ["dep:transcribe-cpp"]
seat = ["wm", "dep:cpal"]

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The seats so far: on Linux, cpal records through ALSA
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal on macOS; elsewhere the CPU until a host asks for more
transcribe-cpp = { version = "0.4.2", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.4.2", optional = true, default-features = false }
