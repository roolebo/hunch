name: host

on:
  push:
    paths: [host/**, .github/workflows/host.yml]
  pull_request:
    paths: [host/**, .github/workflows/host.yml]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: cargo test
      - run: test/run
