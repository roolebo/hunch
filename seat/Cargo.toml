[package]
name = "hunch-seat"
version = "0.1.0"
edition = "2024"
description = "Serves a host's seat to hunch: dictation, its wms and compute"
license = "MIT"

[features]
default = ["wm", "inference", "seat"]
wm = []
inference = ["dep:transcribe-cpp"]
seat = ["wm", "dep:cpal", "dep:opus", "dep:ogg"]

[dependencies]
# The tree and its 9P2000.L, which local: is served with, and the peers
# that mount on the seat
hunch = { package = "hunch-host", path = "../host" }
# Speech to a server as Ogg Opus; opus builds libopus with cmake
ogg = { version = "0.9", optional = true }
opus = { version = "0.4", optional = true }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The seats so far: on Linux, cpal records through ALSA
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal on macOS; elsewhere the CPU until a host asks for more
transcribe-cpp = { version = "0.4.2", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies.transcribe-cpp]
version = "0.4.2"
optional = true
default-features = false
