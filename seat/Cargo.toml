[package]
name = "hunch-seat"
version = "0.1.0"
edition = "2024"
description = "Serves a host's seat to hunch: dictation, its wms and compute"
license = "MIT"

[features]
default = ["wm"]
wm = []

[dependencies]
# The tree, its 9P2000.L, and the peers that mount on it
hunch = { package = "hunch-host", path = "../host" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
